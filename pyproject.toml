[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ccre-rulekit"
version = "0.1.0"
description = "Compile CCRE rule JSON into an intermediate rule plan and multiple execution targets."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "CCRE"}]
dependencies = [
    "pandas>=1.5"
]

[project.optional-dependencies]
spark = ["pyspark>=3.4"]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ccre_rulekit*"]
